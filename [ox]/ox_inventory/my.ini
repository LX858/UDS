[mysqld]
datadir=C:/Program Files/MariaDB 12.3/data
port=3306

# Tăng tốc độ ghi DB gấp 5-10 lần, triệt tiêu lag query (rất quan trọng)
innodb_flush_log_at_trx_commit=2

# Bộ đệm dữ liệu trên RAM (dành cho máy chủ 64GB RAM)
innodb_buffer_pool_size=28G
innodb_buffer_pool_instances=8

# Bộ đệm log giao dịch
innodb_log_buffer_size=128M

# Tối ưu đọc/ghi cho ổ cứng SSD / NVMe
innodb_io_capacity=1000
innodb_io_capacity_max=2000

# Giới hạn kết nối và kích thước gói tin
max_connections=300
max_allowed_packet=128M

# Tối ưu Cache Threads và Tables
thread_cache_size=32
table_open_cache=2048
table_definition_cache=2048

# Tắt DNS lookup để tăng tốc kết nối cục bộ
skip-name-resolve=1

feedback=ON

[client]
port=3306
plugin-dir=C:\Program Files\MariaDB 12.3/lib/plugin