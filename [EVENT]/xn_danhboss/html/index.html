<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Boss Ranking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="hidden">
        <div class="fog"></div>
        <div class="bats" aria-hidden="true">
            <span style="--x:8%;  --d:7s;  --s:1.6">🦇</span>
            <span style="--x:28%; --d:11s; --s:1.1">🦇</span>
            <span style="--x:62%; --d:9s;  --s:1.4">🦇</span>
            <span style="--x:88%; --d:13s; --s:1.0">🦇</span>
        </div>

        <div class="panel">
            <div class="cobweb left">🕸️</div>
            <div class="cobweb right">🕸️</div>

            <header>
                <div class="pumpkins"><span>🎃</span><span class="big">💀</span><span>🎃</span></div>
                <h1>BẢNG XẾP HẠNG SÁT THƯƠNG</h1>
                <p class="sub"><span id="bossName">BOSS</span> đã bị hạ gục!</p>
            </header>

            <div class="reward-info" id="rewardInfo">
                <img id="itemImg" alt="">
                <span>Phần thưởng: <b id="itemLabel"></b></span>
            </div>

            <ul id="rows"></ul>

            <div class="me" id="me">
                <div class="me-title">👻 KẾT QUẢ CỦA BẠN</div>
                <div class="me-body">
                    <div><small>Hạng</small><strong id="meRank">-</strong></div>
                    <div><small>Sát thương</small><strong id="meDamage">-</strong></div>
                    <div class="me-reward">
                        <small>Nhận được</small>
                        <strong><img id="meImg" alt=""><span id="meReward"></span></strong>
                    </div>
                </div>
                <div class="me-note" id="meNote"></div>
                <button id="claimBtn" class="claim">🎁 NHẬN QUÀ</button>
            </div>

            <footer>
                <span>Quà chỉ nhận được 1 lần mỗi lượt Boss</span>
                <button id="closeBtn">ĐÓNG (ESC)</button>
            </footer>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
