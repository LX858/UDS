<svg width="1600" height="760" viewBox="0 0 1600 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panelFill" x1="800" y1="43" x2="800" y2="711" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08171D" stop-opacity="0.96"/>
      <stop offset="0.5" stop-color="#071116" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#050B0F" stop-opacity="0.97"/>
    </linearGradient>

    <linearGradient id="strokeMain" x1="55" y1="380" x2="1545" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E9FF" stop-opacity="0.18"/>
      <stop offset="0.08" stop-color="#00F5FF" stop-opacity="0.95"/>
      <stop offset="0.50" stop-color="#72FFFF" stop-opacity="0.90"/>
      <stop offset="0.92" stop-color="#00F5FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#00E9FF" stop-opacity="0.18"/>
    </linearGradient>

    <linearGradient id="strokeInner" x1="90" y1="380" x2="1510" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00F5FF" stop-opacity="0.12"/>
      <stop offset="0.10" stop-color="#37FFFF" stop-opacity="0.55"/>
      <stop offset="0.50" stop-color="#AFFFFF" stop-opacity="0.45"/>
      <stop offset="0.90" stop-color="#37FFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00F5FF" stop-opacity="0.12"/>
    </linearGradient>

    <linearGradient id="topHighlight" x1="610" y1="50" x2="990" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="0.20" stop-color="#00F5FF" stop-opacity="0.85"/>
      <stop offset="0.50" stop-color="#D8FFFF" stop-opacity="1"/>
      <stop offset="0.80" stop-color="#00F5FF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00F5FF" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scanGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#00F5FF" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>

    <clipPath id="panelClip">
      <path
        d="M82 43
           H515
           L533 51
           H1050
           L1068 43
           H1493
           L1536 86
           V675
           L1502 711
           H1066
           L1054 702
           H548
           L536 711
           H88
           L55 678
           V82
           L82 43Z"
      />
    </clipPath>
  </defs>

  <!-- Main panel: outside remains transparent, inside keeps dark fill -->
  <path
    d="M82 43
       H515
       L533 51
       H1050
       L1068 43
       H1493
       L1536 86
       V675
       L1502 711
       H1066
       L1054 702
       H548
       L536 711
       H88
       L55 678
       V82
       L82 43Z"
    fill="url(#panelFill)"
    stroke="url(#strokeMain)"
    stroke-width="3"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Internal subtle scan pattern -->
  <g clip-path="url(#panelClip)">
    <rect x="55" y="43" width="1481" height="668" fill="url(#scanGrid)" opacity="0.6"/>
  </g>

  <!-- Secondary outer trace -->
  <path
    d="M75 35
       H520
       L537 43
       H1046
       L1063 35
       H1502
       L1548 81
       V680
       L1510 721
       H1061
       L1049 712
       H553
       L541 721
       H80
       L45 686
       V76
       L75 35Z"
    stroke="#00F5FF"
    stroke-opacity="0.28"
    stroke-width="1.35"
    stroke-linejoin="round"
    filter="url(#softGlow)"
  />

  <!-- Inner frame -->
  <path
    d="M95 62
       H506
       L523 70
       H1060
       L1077 62
       H1475
       L1518 105
       V656
       L1487 689
       H1078
       L1068 681
       H533
       L523 689
       H100
       L76 665
       V96
       L95 62Z"
    stroke="url(#strokeInner)"
    stroke-width="1.4"
    stroke-linejoin="round"
  />

  <!-- Top center decorative module -->
  <path d="M545 42H1055L1038 56H562L545 42Z" fill="#00F5FF" fill-opacity="0.10"/>
  <path d="M610 50H990" stroke="url(#topHighlight)" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)"/>
  <path d="M586 43H615L625 63H596L586 43Z" fill="#00F5FF" fill-opacity="0.16"/>
  <path d="M985 43H1014L1004 63H975L985 43Z" fill="#00F5FF" fill-opacity="0.16"/>

  <!-- Corner details -->
  <path d="M82 43H140L130 50H76L82 43Z" fill="#00F5FF" fill-opacity="0.28"/>
  <path d="M1493 43H1435L1445 50H1499L1493 43Z" fill="#00F5FF" fill-opacity="0.28"/>
  <path d="M88 711H145L135 703H82L88 711Z" fill="#00F5FF" fill-opacity="0.18"/>
  <path d="M1502 711H1444L1454 703H1508L1502 711Z" fill="#00F5FF" fill-opacity="0.18"/>

  <!-- Side accents -->
  <path d="M55 82V365" stroke="#00F5FF" stroke-width="2.5" stroke-opacity="0.42" filter="url(#softGlow)"/>
  <path d="M1545 92V365" stroke="#00F5FF" stroke-width="2.5" stroke-opacity="0.32" filter="url(#softGlow)"/>
  <path d="M55 520V678" stroke="#00F5FF" stroke-width="1.6" stroke-opacity="0.22"/>
  <path d="M1545 520V675" stroke="#00F5FF" stroke-width="1.6" stroke-opacity="0.22"/>

  <!-- Bottom center detail -->
  <path d="M95 698H510L525 684H545" stroke="#00F5FF" stroke-opacity="0.36" stroke-width="2"/>
  <path d="M1055 684H1075L1090 698H1490" stroke="#00F5FF" stroke-opacity="0.36" stroke-width="2"/>
  <path d="M555 704H1045" stroke="#00F5FF" stroke-opacity="0.20" stroke-width="1"/>

  <!-- Small ticks -->
  <g opacity="0.42">
    <path d="M110 50H165" stroke="#00F5FF" stroke-width="2"/>
    <path d="M1435 50H1490" stroke="#00F5FF" stroke-width="2"/>
    <path d="M105 704H160" stroke="#00F5FF" stroke-width="2"/>
    <path d="M1440 704H1495" stroke="#00F5FF" stroke-width="2"/>
  </g>
</svg>
