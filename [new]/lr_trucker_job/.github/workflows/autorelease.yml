name: Verify and release v2

on:
  push:
    branches: ['main']
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.32.1'
  LUALS_VERSION: '3.19.1'
  LUALS_LINUX_X64_SHA256: 'e9235d2d72ef55bc41cf8c99cda2ed64777682024b4bb81f5dea425060c5cbb8'
  LUALS_WIN32_X64_SHA256: 'fdb9a59108cf62517813c97fa5549b0e16d1ef0688306bac728b08434db7e4cd'
  RESOURCE_NAME: ${{ github.event.repository.name }}

jobs:
  verify-ubuntu:
    name: Ubuntu full verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install pinned LuaLS
        run: |
          mkdir -p .tools/lua-language-server
          curl --fail --location --silent --show-error \
            "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz" \
            --output .tools/luals.tar.gz
          echo "${LUALS_LINUX_X64_SHA256}  .tools/luals.tar.gz" | sha256sum --check --strict
          tar -xzf .tools/luals.tar.gz -C .tools/lua-language-server

      - name: Install Chromium for browser E2E
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Verify
        run: pnpm verify

      - name: Package resource
        run: node tooling/scripts/package-resource.mjs --root . --out dist/release --name "$RESOURCE_NAME"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.RESOURCE_NAME }}-release
          path: |
            dist/release/${{ env.RESOURCE_NAME }}.zip
            dist/release/${{ env.RESOURCE_NAME }}/release-manifest.txt
          if-no-files-found: error

  smoke-windows:
    name: Windows smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install pinned LuaLS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .tools/lua-language-server -Force | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/LuaLS/lua-language-server/releases/download/$env:LUALS_VERSION/lua-language-server-$env:LUALS_VERSION-win32-x64.zip" `
            -OutFile .tools/luals.zip
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath .tools/luals.zip).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:LUALS_WIN32_X64_SHA256) {
            throw "LuaLS archive checksum mismatch"
          }
          Expand-Archive -LiteralPath .tools/luals.zip -DestinationPath .tools/lua-language-server

      - name: Cross-platform smoke
        run: pnpm check:contracts && pnpm check:cfx && pnpm typecheck && pnpm test:lua && pnpm test:security && pnpm check:luals && pnpm build && pnpm verify:manifest

      - name: Stage resource
        run: node tooling/scripts/package-resource.mjs --root . --out dist/release --name "$env:RESOURCE_NAME" --no-zip

  publish-npm:
    name: Publish npm initializer
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify-ubuntu, smoke-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Check package version
        id: package
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const packageJson = JSON.parse(
            fs.readFileSync('packages/create-lr-resource/package.json', 'utf8')
          );
          const response = await fetch(
            `https://registry.npmjs.org/${packageJson.name}/${packageJson.version}`
          );
          if (response.status !== 200 && response.status !== 404) {
            throw new Error(`npm registry version check failed with HTTP ${response.status}`);
          }
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `name=${packageJson.name}\nversion=${packageJson.version}\npublish=${response.status === 404}\n`
          );
          NODE

      - name: Verify npm OIDC support
        if: steps.package.outputs.publish == 'true'
        run: |
          NPM_VERSION="$(npm --version)"
          echo "npm $NPM_VERSION"
          node -e "const [major, minor] = process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && minor < 5)) process.exit(1)" "$NPM_VERSION"

      - name: Publish package
        if: steps.package.outputs.publish == 'true'
        run: npm publish ./packages/create-lr-resource --access public

      - name: Report existing version
        if: steps.package.outputs.publish != 'true'
        run: echo "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }} already exists; skipping publish."

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify-ubuntu, smoke-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.RESOURCE_NAME }}-release
          path: dist/release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" "dist/release/${RESOURCE_NAME}.zip" --title "$TAG_NAME" --generate-notes
