<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Dollar bill background -->
  <rect x="8" y="20" width="112" height="88" rx="8" fill="#85BB65" stroke="#5A8A3C" stroke-width="2"/>
  <!-- Inner border -->
  <rect x="16" y="28" width="96" height="72" rx="4" fill="none" stroke="#A8D08D" stroke-width="1.5" opacity="0.6"/>
  <!-- Circle emblem -->
  <circle cx="64" cy="64" r="26" fill="none" stroke="#A8D08D" stroke-width="1.5" opacity="0.4"/>
  <!-- Dollar sign -->
  <text x="64" y="76" text-anchor="middle" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="#1A4A1A">$</text>
  <!-- Corner numbers -->
  <text x="24" y="40" text-anchor="start" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#A8D08D" opacity="0.5">$</text>
  <text x="104" y="93" text-anchor="end" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#A8D08D" opacity="0.5">$</text>
  <!-- Decorative dots -->
  <circle cx="24" cy="97" r="1.5" fill="#A8D08D" opacity="0.3"/>
  <circle cx="104" cy="36" r="1.5" fill="#A8D08D" opacity="0.3"/>
</svg>
